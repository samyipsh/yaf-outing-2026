<script>
(() => {
  const form = document.getElementById('unlock')
  const button = form.querySelector('button')
  const input = document.getElementById('password')
  const error = document.getElementById('error')
  const answers = document.getElementById('answers')
  const locked = JSON.parse(document.getElementById('locked').textContent)
  const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0))
  const KEY = 'yaf-types-password'

  async function open(password) {
    const material = await crypto.subtle.importKey('raw', new TextEncoder().encode(password.trim().toLowerCase()), 'PBKDF2', false, ['deriveKey'])
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bytes(locked.salt), iterations: locked.iterations, hash: 'SHA-256' }, material, { name: 'AES-GCM', length: 256 }, false, ['decrypt'])
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(locked.iv) }, key, bytes(locked.data))
    answers.innerHTML = new TextDecoder().decode(plain)
    setUpRefs()
    answers.hidden = false
    form.hidden = true
    // Focus for screen readers, without scrolling the title away.
    answers.focus({ preventScroll: true })
    try { sessionStorage.setItem(KEY, password) } catch {}
  }

  // Bible references: a tap shows the verses in a box under the reference, with a link to the
  // passage on BibleGateway. A reference without verses in the kjv block stays a plain link.
  const main = document.querySelector('main')
  const verse = document.getElementById('verse')
  const verseTitle = document.getElementById('verse-title')
  const verseText = document.getElementById('verse-text')
  const verseOpen = document.getElementById('verse-open')
  const searchOf = a => new URL(a.href).searchParams.get('search')
  let kjv = {}
  let shown = null
  let watcher = null

  function setUpRefs() {
    try { kjv = JSON.parse(answers.querySelector('#kjv')?.textContent || '{}') } catch { kjv = {} }
    for (const a of answers.querySelectorAll('a.ref')) {
      if (!kjv[searchOf(a)]) continue
      a.setAttribute('role', 'button')
      a.setAttribute('aria-expanded', 'false')
      a.setAttribute('aria-controls', 'verse')
    }
  }

  function place() {
    if (!shown) return
    const m = main.getBoundingClientRect()
    const pad = getComputedStyle(main)
    const left = parseFloat(pad.paddingLeft)
    const right = parseFloat(pad.paddingRight)
    const r = shown.getClientRects()[0] || shown.getBoundingClientRect()
    const below = r.bottom - parseFloat(getComputedStyle(shown).paddingBottom)
    verse.style.left = `${left}px`
    verse.style.right = `${right}px`
    verse.style.top = `${below - m.top + 10}px`
    const x = r.left + r.width / 2 - m.left - left
    verse.style.setProperty('--caret', `${Math.max(20, Math.min(x, m.width - left - right - 20))}px`)
  }

  function show(a) {
    const search = searchOf(a)
    const verses = kjv[search]
    const tag = document.createElement('span')
    tag.className = 'kjv'
    tag.textContent = 'KJV'
    verseTitle.replaceChildren(search.replace(/-/g, '–').replace(/,/g, ', '), ' ', tag)
    const parts = []
    for (const [n, text] of verses) {
      if (verses.length > 1) {
        const b = document.createElement('b')
        b.textContent = n
        parts.push(b, ' ')
      }
      parts.push(`${text} `)
    }
    verseText.replaceChildren(...parts)
    verseText.scrollTop = 0
    fade()
    verseOpen.href = a.href
    shown?.setAttribute('aria-expanded', 'false')
    shown = a
    a.setAttribute('aria-expanded', 'true')
    verse.hidden = false
    place()
    verse.focus({ preventScroll: true })
    verse.scrollIntoView({ block: 'nearest', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' })
    // Android's Back closes the box instead of leaving the page.
    if ('CloseWatcher' in window && !watcher) {
      watcher = new CloseWatcher()
      watcher.onclose = () => { watcher = null; hide() }
    }
  }

  function fade() {
    verseText.classList.toggle('more', verseText.scrollTop + verseText.clientHeight < verseText.scrollHeight - 4)
  }

  function hide() {
    if (!shown) return
    const a = shown
    const focusBack = verse.contains(document.activeElement)
    shown = null
    a.setAttribute('aria-expanded', 'false')
    verse.hidden = true
    watcher?.destroy()
    watcher = null
    if (focusBack) a.focus({ preventScroll: true })
  }

  document.addEventListener('click', (e) => {
    const a = e.target.closest?.('a.ref[role="button"]')
    if (!a || e.metaKey || e.ctrlKey || e.shiftKey) return
    e.preventDefault()
    if (a === shown) hide()
    else show(a)
  })
  // A touch anywhere else closes the box. pointerdown, because iPhones don't send a click for a
  // tap on plain text.
  document.addEventListener('pointerdown', (e) => {
    if (shown && !verse.contains(e.target) && !e.target.closest?.('a.ref[role="button"]')) hide()
  })
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && shown) hide()
    if (e.key === ' ' && e.target.matches?.('a.ref[role="button"]')) {
      e.preventDefault()
      e.target.click()
    }
  })
  document.getElementById('verse-close').addEventListener('click', hide)
  verseText.addEventListener('scroll', fade, { passive: true })
  // Keep the box under its reference when the text reflows, e.g. once the web fonts arrive.
  if ('ResizeObserver' in window) new ResizeObserver(place).observe(answers)
  else addEventListener('resize', place)

  form.addEventListener('submit', async (e) => {
    e.preventDefault()
    error.textContent = ''
    if (!window.crypto?.subtle) {
      error.textContent = 'This browser can’t open it. Try Chrome or Safari.'
      return
    }
    button.disabled = true
    button.textContent = 'Opening…'
    try {
      await open(input.value)
    }
    catch {
      error.textContent = 'That isn’t the password.'
      input.select()
    }
    finally {
      button.disabled = false
      button.textContent = 'Open'
    }
  })

  // Opened already in this tab: open again without asking.
  let saved = null
  try { saved = sessionStorage.getItem(KEY) } catch {}
  if (saved) open(saved).catch(() => {})
})()
</script>
